<div class="w-[92vw] max-w-[1400px] h-fit relative">

  <!-- Header -->
  <div class="mb-10">

    <p class="text-4xl font-bold text-[#8c5a2b] mb-3">
      CHỈNH SỬA SẢN PHẨM
    </p>

    <p class="text-lg text-[#b27b48]">
      Cập nhật thông tin sản phẩm trong hệ thống
    </p>

  </div>

  <!-- Form Card -->
  <div class="w-[480px]
          bg-[#fffaf5]
          rounded-[32px]
          border border-[#f0d7be]
          shadow-[0_15px_40px_rgba(0,0,0,0.08)]
          mx-auto
          overflow-hidden">

    <!-- Top -->
    <div class="bg-[#fff4e8]
            border-b border-[#f3dfcb]
            px-8 py-6">

      <div class="flex items-center gap-4">

        <div class="w-[60px] h-[60px]
                rounded-2xl
                bg-[#dea069]
                flex items-center justify-center
                shadow-md">

          <box-icon name='edit'
                    color='white'
                    size='md'>
          </box-icon>

        </div>

        <div>

          <p class="text-2xl font-bold text-[#8c5a2b]">
            Thông tin sản phẩm
          </p>

          <p class="text-gray-500">
            Chỉnh sửa và cập nhật dữ liệu
          </p>

        </div>

      </div>

    </div>

    <!-- Form -->
    <form method="post"
          th:action="@{/admin/save}"
          th:object="${product}"
          enctype="multipart/form-data"
          class="px-8 py-8">

      <input type="hidden"
             name="id"
             th:field="*{id}"
             readonly="readonly">

      <!-- Product Name -->
      <div class="mb-6">

        <p class="text-sm font-semibold text-[#8c5a2b] mb-2">
          Tên sản phẩm
        </p>

        <input class="w-full
                   h-[48px]
                   border border-[#e8cfb6]
                   bg-white
                   rounded-2xl
                   px-4
                   outline-none
                   focus:border-[#dea069]
                   focus:ring-4
                   focus:ring-[#f7e3cf]
                   transition"
               type="text"
               name="name"
               id="name"
               th:field="*{name}"
               placeholder="Nhập tên sản phẩm">

      </div>

      <!-- Category -->
      <div class="mb-6">

        <p class="text-sm font-semibold text-[#8c5a2b] mb-2">
          Phân loại sản phẩm
        </p>

        <select id="chonLoai"
                name="chonLoai"
                th:field="*{category.id}"
                class="w-full
                   h-[48px]
                   border border-[#e8cfb6]
                   rounded-2xl
                   px-4
                   bg-white
                   outline-none
                   focus:border-[#dea069]
                   focus:ring-4
                   focus:ring-[#f7e3cf]
                   transition">

          <option value="" disabled selected>
            Chọn loại sản phẩm
          </option>

          <option th:each="category : ${categories}"
                  th:value="${category.id}"
                  th:text="${category.name}">
            Máy ảnh
          </option>

        </select>

      </div>

      <!-- Image -->
      <div class="mb-6">

        <p class="text-sm font-semibold text-[#8c5a2b] mb-3">
          Hình ảnh sản phẩm
        </p>

        <div class="bg-[#fff4e8]
                border border-[#f0d7be]
                rounded-2xl
                p-5">

          <div class="flex justify-center mb-4">

            <img th:src="@{${product.imageUrl}}"
                 alt="Ảnh sản phẩm"
                 class="w-[140px]
                    h-[140px]
                    object-cover
                    rounded-2xl
                    border border-[#ecd3ba]
                    shadow-md">

          </div>

          <input type="hidden" th:field="*{imageUrl}">

          <label for="fileInput"
                 class="block
                    text-sm
                    font-medium
                    text-[#8c5a2b]
                    mb-2">

            Chọn ảnh mới

          </label>

          <input class="w-full
                     border border-[#e8cfb6]
                     rounded-xl
                     p-2
                     bg-white
                     cursor-pointer"
                 type="file"
                 name="fileInput"
                 id="fileInput"
                 accept="image/*">

        </div>

      </div>

      <!-- Price -->
      <div class="mb-6">

        <p class="text-sm font-semibold text-[#8c5a2b] mb-2">
          Giá bán
        </p>

        <input class="w-full
                   h-[48px]
                   border border-[#e8cfb6]
                   rounded-2xl
                   px-4
                   outline-none
                   focus:border-[#dea069]
                   focus:ring-4
                   focus:ring-[#f7e3cf]
                   transition"
               type="number"
               id="giaBan"
               name="giaBan"
               th:field="*{price}"
               placeholder="Nhập giá bán">

      </div>

      <!-- Quantity -->
      <div class="mb-6">

        <p class="text-sm font-semibold text-[#8c5a2b] mb-2">
          Tồn kho
        </p>

        <input class="w-full
                   h-[48px]
                   border border-[#e8cfb6]
                   rounded-2xl
                   px-4
                   outline-none
                   focus:border-[#dea069]
                   focus:ring-4
                   focus:ring-[#f7e3cf]
                   transition"
               type="number"
               id="tonKho"
               name="tonKho"
               th:field="*{quantity}"
               placeholder="Nhập số lượng sản phẩm">

      </div>

      <!-- Description -->
      <div class="mb-8">

        <p class="text-sm font-semibold text-[#8c5a2b] mb-2">
          Mô tả sản phẩm
        </p>

        <textarea class="w-full
                     h-[120px]
                     border border-[#e8cfb6]
                     rounded-2xl
                     p-4
                     resize-none
                     outline-none
                     focus:border-[#dea069]
                     focus:ring-4
                     focus:ring-[#f7e3cf]
                     transition"
                  id="moTa"
                  name="moTa"
                  th:field="*{description}">
        </textarea>

      </div>

      <!-- Button -->
      <div class="flex justify-end">

        <button class="w-[160px]
                   h-[50px]
                   bg-gradient-to-r
                   from-[#dea069]
                   to-[#c88447]
                   hover:shadow-xl
                   hover:scale-[1.03]
                   active:scale-[0.98]
                   text-white
                   text-lg
                   font-semibold
                   rounded-2xl
                   transition duration-300
                   cursor-pointer"
                type="submit">

          Lưu lại

        </button>

      </div>

    </form>

  </div>

</div>
