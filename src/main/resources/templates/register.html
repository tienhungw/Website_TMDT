<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap');

    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Montserrat', sans-serif;
    }

    body{
        background-color: #f1f2f6;
        /* background: linear-gradient(to right, #e2e2e2, #c9d6ff, #512da8); */
        display: flex;
        align-items: center;
        /* justify-content: center; */
        flex-direction: column;
        /* height: 100vh; */
        overflow-x: hidden;
    }

    .navb {
        display: flex;
        flex-direction: row;
        /* border: black solid; */
        height: 80px;
        width: 100vw;
        justify-content: space-between;
        margin-bottom: 50px;
        background-color: #dea069;
        color: #fff;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
    }

    .infor-shop {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
    }

    .navb img {
        width: 50px;
        height: 50px;
        border-radius: 999px;
        margin-left: 20px;
    }

    .navb h2 {
        font-size: 30px;
        font-weight: 500;
        margin-left: 10px;
        font-family: 'Kaushan Script';
        margin-top: 10px;
    }

    .container{
        background-color: #fff;
        border-radius: 30px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
        position: relative;
        overflow: hidden;
        /* width: 768px; */
        width: 650px;
        max-width: 100%;
        /* min-height: 480px; */
        height: 550px;
        width: 750px;
    }

    .container p{
        font-size: 14px;
        line-height: 20px;
        letter-spacing: 0.3px;
        margin: 10px 0;
    }

    .container span{
        font-size: 12px;
    }

    .container a{
        color: #333;
        font-size: 13px;
        text-decoration: none;
        margin: 10px 0 10px;
    }

    .container button{
        background-color:  #dea069;
        color: #fff;
        font-size: 12px;
        padding: 10px 45px;
        border: 1px solid transparent;
        border-radius: 8px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin-top: 5px;
        cursor: pointer;
    }

    .container button.hidden{
        background-color: transparent;
        border-color: #fff;
    }

    .container form{
        background-color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 0 40px;
        height: 100%;
    }

    .container input{
        background-color: #eee;
        border: none;
        margin: 5px 0;
        padding: 10px 15px;
        font-size: 13px;
        border-radius: 8px;
        width: 100%;
        outline: none;
    }

    .form-container{
        position: absolute;
        top: 0;
        height: 100%;
        transition: all 0.6s ease-in-out;
    }

    .sign-in{
        left: 0;
        width: 50%;
        z-index: 2;
    }

    .container.active .sign-in{
        transform: translateX(100%);
    }

    .sign-up{
        left: 0;
        width: 50%;
        opacity: 0;
        z-index: 1;
    }

    .container.active .sign-up{
        transform: translateX(100%);
        opacity: 1;
        z-index: 5;
        animation: move 0.6s;
    }

    @keyframes move{
        0%, 49.99%{
            opacity: 0;
            z-index: 1;
        }
        50%, 100%{
            opacity: 1;
            z-index: 5;
        }
    }

    .social-icons{
        margin: 20px 0;
    }

    .social-icons a{
        border: 1px solid #ccc;
        border-radius: 20%;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        margin: 0 3px;
        width: 40px;
        height: 40px;
    }

    .toggle-container{
        position: absolute;
        top: 0;
        left: 50%;
        width: 50%;
        height: 100%;
        overflow: hidden;
        transition: all 0.6s ease-in-out;
        border-radius: 150px 0 0 100px;
        z-index: 1000;
    }

    .container.active .toggle-container{
        transform: translateX(-100%);
        border-radius: 0 150px 100px 0;
    }

    .toggle{
        background-color: #cd6133;
        height: 100%;
        background: linear-gradient(to right, #dea069, #cd6133);
        color: #fff;
        position: relative;
        left: -100%;
        height: 100%;
        width: 200%;
        transform: translateX(0);
        transition: all 0.6s ease-in-out;
    }

    .container.active .toggle{
        transform: translateX(50%);
    }

    .toggle-panel{
        position: absolute;
        width: 50%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 0 30px;
        text-align: center;
        top: 0;
        transform: translateX(0);
        transition: all 0.6s ease-in-out;
    }

    .toggle-left{
        transform: translateX(-200%);
    }

    .container.active .toggle-left{
        transform: translateX(0);
    }

    .toggle-right{
        right: 0;
        transform: translateX(0);
    }

    .container.active .toggle-right{
        transform: translateX(200%);
    }


    .foot{
        width: 60vw;
        height: 30px;
        margin-top: 70px;
        margin-bottom: 20px;
        margin-left: 4px;
    }

    .foot p{
        font-size: 18px;
        font-weight: 400;
        color: #1F2937;
        text-align: center;
    }
</style>
<body class="flex items-center justify-center h-screen bg-gray-100">
<div class="navb flex flex-row  h-[80px] w-[100vw] fixed top-0 justify-between mb-[100px]">
    <div class="infor-shop  h-[80px] w-[20vw]">
        <img src="https://scontent.fhan14-5.fna.fbcdn.net/v/t39.30808-6/346981893_268842172188334_5218611456593072265_n.jpg?stp=cp6_dst-jpg_tt6&_nc_cat=106&ccb=1-7&_nc_sid=6ee11a&_nc_ohc=mixcY76NRBQQ7kNvwH5aUWy&_nc_oc=Adp9P_rNjoKuk0wzCgo1d96PT430usRaeyH6bL0fE2a32VPEK-fdTajfUgmWclLqFNQ&_nc_zt=23&_nc_ht=scontent.fhan14-5.fna&_nc_gid=mRkFV-YuXKvyrGWHyUy4lA&_nc_ss=7b2a8&oh=00_Af7S8Rpj585Ize0RKanTiKCQ69TS90G3-cQRf9MAkfI-yA&oe=6A13D611" alt="">
        <h2>TH Shop</h2>
    </div>


</div>
<form th:action="@{/register}" th:object="${user}" method="post" class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center">Đăng ký</h2>
    <div class="mb-4">
        <label for="username" class="block text-sm font-medium text-gray-700">Tên đăng nhập</label>
        <input type="text" id="username" th:field="*{username}" class="w-full border p-2 rounded mt-1">
    </div>
    <div class="mb-4">
        <label for="full_name" class="block text-sm font-medium text-gray-700">Họ tên</label>
        <input type="text" id="full_name" th:field="*{full_name}" class="w-full border p-2 rounded mt-1">
    </div>
    <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" th:field="*{email}" class="w-full border p-2 rounded mt-1">
    </div>
    <div class="mb-4">
        <label for="phone" class="block text-sm font-medium text-gray-700">Số điện thoại</label>
        <input type="text" id="phone" th:field="*{phone}" class="w-full border p-2 rounded mt-1">
    </div>
    <div class="mb-4">
        <label for="password" class="block text-sm font-medium text-gray-700">Mật khẩu</label>
        <input type="password" id="password" th:field="*{password}" class="w-full border p-2 rounded mt-1">
    </div>
    <div class="mb-6">
        <label for="address" class="block text-sm font-medium text-gray-700">Địa chỉ</label>
        <input type="text" id="address" th:field="*{address}" class="w-full border p-2 rounded mt-1">
    </div>
    <button type="submit"
            class="w-full text-white p-2 rounded hover:opacity-90"
            style="background-color:#cc8e35;">
        Đăng ký
    </button>
</form>
</body>
</html>
