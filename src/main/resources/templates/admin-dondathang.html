        <div class="mt-6 bg-white rounded-3xl shadow-[0_10px_30px_rgba(0,0,0,0.08)] overflow-hidden border border-[#f3d8be]">

            <!-- Header -->
            <div class="flex items-center justify-between px-8 py-6 bg-[#fff4e8] border-b border-[#f3dfcb]">
                <div>
                    <p class="text-2xl font-bold text-[#8c5a2b]">
                        Danh sách đơn hàng
                    </p>
                    <p class="text-gray-500 mt-1">
                        Quản lý và cập nhật trạng thái đơn hàng
                    </p>
                </div>

                <div class="bg-[#dea069] text-white px-5 py-3 rounded-2xl shadow font-semibold">
                    <span th:text="${orders.size()}"></span> đơn hàng
                </div>
            </div>

            <!-- Table -->
            <div class="overflow-x-auto">

                <table class="min-w-full border-collapse">

                    <thead>

                    <tr class="bg-[#dea069] text-white">

                        <th class="px-6 py-5 text-center text-lg font-semibold">
                            Mã đơn
                        </th>

                        <th class="px-6 py-5 text-center text-lg font-semibold">
                            Khách hàng
                        </th>

                        <th class="px-6 py-5 text-center text-lg font-semibold">
                            Địa chỉ
                        </th>

                        <th class="px-6 py-5 text-center text-lg font-semibold">
                            Tổng tiền
                        </th>

                        <th class="px-6 py-5 text-center text-lg font-semibold">
                            Trạng thái
                        </th>

                        <th class="px-6 py-5 text-center text-lg font-semibold">
                            Chi tiết
                        </th>

                    </tr>

                    </thead>

                    <tbody class="bg-white">

                    <tr th:each="order : ${orders}"
                        class="border-b border-[#f5e3cf]
                       hover:bg-[#fffaf5]
                       transition duration-200">

                        <!-- ID -->
                        <td class="px-6 py-5 text-center font-bold text-[#8c5a2b]"
                            th:text="${order.id}">
                        </td>

                        <!-- User -->
                        <td class="px-6 py-5 text-center font-medium text-gray-700"
                            th:text="${order.user.full_name}">
                        </td>

                        <!-- Address -->
                        <td class="px-6 py-5 text-center text-gray-600 leading-7"
                            th:text="${order.user.address}">
                        </td>

                        <!-- Price -->
                        <td class="px-6 py-5 text-center">

                    <span class="bg-[#fff2e7]
                                 text-[#c26d1d]
                                 px-4 py-2
                                 rounded-xl
                                 font-bold
                                 shadow-sm"
                          th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' VND'">
                    </span>

                        </td>

                        <!-- Status -->
                        <td class="px-6 py-5 text-center">

                            <form th:action="@{/admin/order/status}" method="post">

                                <input type="hidden"
                                       name="orderId"
                                       th:value="${order.id}" />

                                <div class="flex flex-col items-center gap-3">

                                    <select name="status"
                                            class="w-[180px]
                                           h-[42px]
                                           rounded-xl
                                           border border-[#e7c8a8]
                                           bg-[#fffaf5]
                                           px-3
                                           text-[#8c5a2b]
                                           font-semibold
                                           outline-none
                                           focus:border-[#dea069]
                                           focus:ring-2
                                           focus:ring-[#f4d1b2]
                                           transition">

                                        <option th:each="status : ${statusList}"
                                                th:value="${status}"
                                                th:text="${status}"
                                                th:selected="${status == order.status}">
                                            Status
                                        </option>

                                    </select>

                                    <button class="w-[110px]
                                           h-[40px]
                                           bg-[#dea069]
                                           hover:bg-[#c88447]
                                           text-white
                                           font-semibold
                                           rounded-xl
                                           shadow-md
                                           hover:scale-[1.03]
                                           active:scale-[0.97]
                                           transition duration-300
                                           cursor-pointer"
                                            type="submit">

                                        Save

                                    </button>

                                </div>

                            </form>

                        </td>

                        <!-- Detail -->
                        <td class="px-6 py-5 text-center">

                            <div class="flex justify-center">

                                <form th:action="@{'/admin/order/'+${order.id}}"
                                      method="get">

                                    <button class="w-[120px]
                                           h-[42px]
                                           bg-[#DAB10C]
                                           hover:bg-[#f4c430]
                                           text-white
                                           font-semibold
                                           rounded-xl
                                           shadow-md
                                           hover:scale-[1.03]
                                           active:scale-[0.98]
                                           transition duration-300
                                           cursor-pointer">

                                        Chi tiết

                                    </button>

                                </form>

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>


    </div>

    <div class="w-[60vw] h-[30px] mt-[100px] mb-5">
        <p class="text-lg font-nomarl text-gray-600 text-center">
            © 2025 Bản quyền thuộc về TH Shop
        </p>
    </div>
