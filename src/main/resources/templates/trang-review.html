<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap" rel="stylesheet">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh gia</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
</head>

<body class="flex flex-col justify-center items-center bg-[#F3F1EC] overflow-x-hidden">
<div class="navb flex flex-row h-[80px] w-[100vw] justify-between mb-[50px] bg-[#dea069] text-white shadow-[0_5px_15px_rgba(0,0,0,0.35)]">
  <div class="infor-shop h-[80px] w-fit flex flex-row justify-center items-center ml-2">
    <img class="w-[50px] h-[50px] rounded-[999px] ml-[20px]" src="/img/tienhungw.jpg" alt="">
    <h2 class="text-[30px] font-medium ml-[10px] mt-[10px] font-['Kaushan_Script']">TH Shop</h2>
  </div>

  <div class="relative h-[80px] w-[50vw] absolute right-[20px]">
    <div class="flex flex-row h-[40px] bg-white w-[400px] absolute right-[20px] rounded-3xl justify-between mt-1">
      <input class="outline-none text-gray-600 pl-4" type="text" placeholder="Tìm kiếm sản phẩm">
      <box-icon class="mr-3 mt-2 cursor-pointer" name='search' flip='horizontal' color='rgba(0,0,0,0.8)' ></box-icon>
    </div>
    <div class="flex flex-row absolute gap-[30px] right-[20px] bottom-[6px] text-lg font-normal">
      <a id="gotoPage1" class="cursor-pointer" href="/user/home">Trang chủ</a>
      <a id="gotoPage2" class="cursor-pointer" href="/user/cart">Giỏ hàng</a>
      <a id="gotoPage3" class="cursor-pointer underline" style="text-underline-offset: 4px; text-decoration-thickness: 2px;" href="/user/history">Lịch sử</a>
      <a id="gotoPage4" class="cursor-pointer" href="/user/about">Thông tin</a>
      <a id="gotoPage5" class="cursor-pointer" href="/logout">Đăng xuất</a>
    </div>
  </div>
</div>

<div class="w-[1000px] flex flex-row gap-[50px] bg-[#f7e6d3] rounded-[30px] p-[40px] shadow-[0_10px_30px_rgba(0,0,0,0.15)] border border-[#e0b184]">

  <!-- PRODUCT -->
  <div class="w-[350px] flex flex-col items-center">

    <div class="bg-white p-5 rounded-[25px] shadow-md">
      <img th:src="@{${product.imageUrl}}"
           alt="Hình ảnh"
           class="w-[250px] h-[250px] object-cover rounded-[20px]">
    </div>

    <div class="mt-6 text-[24px] font-semibold text-[#9a5c22] text-center leading-8"
         th:text="${product.name}">
    </div>

    <div class="mt-3 text-gray-600 text-center text-[16px]">
      Hãy chia sẻ trải nghiệm của bạn về sản phẩm này
    </div>

  </div>


  <!-- FORM -->
  <div class="flex-1">

    <div class="mb-8">
      <p class="text-[34px] font-bold text-[#b86d29]">
        Đánh giá sản phẩm
      </p>

      <div class="w-[120px] h-[5px] bg-[#dea069] rounded-full mt-2"></div>
    </div>

    <form method="post"
          th:action="@{/user/review/save}"
          th:object="${review}"
          class="flex flex-col gap-6">

      <input type="hidden"
             name="productId"
             th:value="${product.id}" />

      <input type="hidden"
             name="orderDetailId"
             th:value="${orderDetail.id}" />


      <!-- TEXTAREA -->
      <div class="flex flex-col">

        <label for="content"
               class="text-[18px] font-semibold text-[#9a5c22] mb-3">
          Nội dung đánh giá
        </label>

        <textarea name="content"
                  id="content"
                  rows="7"
                  required
                  placeholder="Ví dụ: Sản phẩm đẹp, đóng gói cẩn thận, giao hàng nhanh..."
                  class="bg-white border-2 border-[#e0b184]
                                 rounded-[20px]
                                 p-5
                                 text-[16px]
                                 outline-none
                                 resize-none
                                 transition-all
                                 duration-300
                                 focus:border-[#c97d38]
                                 focus:shadow-[0_0_15px_rgba(222,160,105,0.4)]"></textarea>

      </div>


      <!-- SELECT -->
      <div class="flex flex-col">

        <label for="rating"
               class="text-[18px] font-semibold text-[#9a5c22] mb-3">
          Đánh giá sao
        </label>

        <select name="rating"
                id="rating"
                required
                class="bg-white border-2 border-[#e0b184]
                               rounded-[16px]
                               h-[55px]
                               px-5
                               text-[16px]
                               outline-none
                               transition-all
                               duration-300
                               focus:border-[#c97d38]
                               focus:shadow-[0_0_15px_rgba(222,160,105,0.4)]">

          <option value="" disabled selected>
            Chọn số sao
          </option>

          <option value="1">⭐ 1 sao</option>
          <option value="2">⭐⭐ 2 sao</option>
          <option value="3">⭐⭐⭐ 3 sao</option>
          <option value="4">⭐⭐⭐⭐ 4 sao</option>
          <option value="5">⭐⭐⭐⭐⭐ 5 sao</option>

        </select>

      </div>


      <!-- BUTTON -->
      <button type="submit"
              class="mt-4 h-[60px]
                           rounded-[18px]
                           bg-[#dea069]
                           text-white
                           text-[20px]
                           font-semibold
                           cursor-pointer
                           shadow-lg
                           transition-all
                           duration-300
                           hover:bg-[#c97d38]
                           hover:scale-[1.02]
                           hover:shadow-[0_10px_25px_rgba(201,125,56,0.45)]">

        Gửi đánh giá

      </button>

    </form>

  </div>

</div>


</body>
</html>
